[project]
name = "lara-asistente"
version = "11.0.0"
description = "LARA — asistente de escritorio tipo JARVIS para Windows (cerebro híbrido local + nube, voz, visión, memoria)."
readme = "LEEME.md"
requires-python = ">=3.12"
authors = [{ name = "Adi" }]

# Dependencias de ejecución. La lista canónica y comentada sigue en
# requirements.txt; las versiones exactas verificadas están en
# requirements.lock (lo que instala INSTALAR_LARA.bat). Esta lista debe
# coincidir con requirements.txt: tests/test_instalacion.py lo comprueba.
dependencies = [
    "groq",
    "google-genai",
    "python-dotenv",
    "requests",
    "plyer",
    "pillow",
    "yt-dlp",
    "edge-tts",
    "SpeechRecognition",
    "sounddevice",
    "numpy",
    "miniaudio",
    "pyttsx3",
    "kokoro-onnx",
    "espeakng-loader",
    "phonemizer-fork",
    "faster-whisper",
    "openwakeword",
    "pypdf",
    "python-docx",
    "pyautogui",
    "pynput",
    "pygetwindow",
    "scipy",
    "python_speech_features",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lara = "main:main"

[tool.setuptools]
py-modules = ["main", "config", "ui_tema", "gui", "gui_explicacion", "gui_opencode"]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
